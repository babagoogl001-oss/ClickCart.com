<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QuanTa Solutions</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* ===== BASE ===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}

body{
background:#050b1f;
color:white;
overflow-x:hidden;
}

/* GRID + GLOW BG */
body:before{
content:"";
position:fixed;inset:0;
background:
linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
background-size:42px 42px;
z-index:-2;
}
body:after{
content:"";
position:fixed;inset:0;
background:radial-gradient(circle at top,#0b38ff55,transparent 60%);
z-index:-3;
}

/* HEADER */
.header{text-align:center;padding:60px 20px}

.logo{
font-size:38px;
font-weight:700;
letter-spacing:3px;
background:linear-gradient(90deg,#00eaff,#7a5cff);
-webkit-background-clip:text;
color:transparent;
}

.tagline{
margin-top:12px;
opacity:.85;
}

/* SERVICES */
.services{
max-width:950px;
margin:auto;
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:24px;
}

.card{
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
border-radius:22px;
padding:32px;
text-align:center;
cursor:pointer;
transition:.35s;
border:1px solid rgba(255,255,255,.12);
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 30px #00eaff55;
}

.icon{
font-size:42px;
margin-bottom:12px;
opacity:.9;
}

/* aesthetic borders */
.card:nth-child(1){border-top:3px solid #00eaff}
.card:nth-child(2){border-top:3px solid #ff7a7a}
.card:nth-child(3){border-top:3px solid #7affc1}
.card:nth-child(4){border-top:3px solid #ffd36b}
.card:nth-child(5){border-top:3px solid #b67aff}
.card:nth-child(6){border-top:3px solid #7ab6ff}
.card:nth-child(7){border-top:3px solid #ff7ad9}

/* MODAL */
.modal{
position:fixed;
inset:0;
background:#000000cc;
display:none;
justify-content:center;
align-items:center;
padding:15px;
z-index:999;
}
.modal.show{display:flex}

.box{
background:#07142f;
padding:22px;
border-radius:16px;
width:100%;
max-width:430px;
max-height:90vh;
overflow:auto;
}

input,select,textarea{
width:100%;
margin:7px 0;
padding:12px;
border-radius:10px;
border:none;
background:#0b1e45;
color:#fff;
}

button{
width:100%;
padding:13px;
margin-top:10px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#00eaff,#7a5cff);
color:white;
font-weight:600;
cursor:pointer;
}

.addPassenger{background:#1a2f6d}

/* FLOAT WHATSAPP */
.whatsapp{
position:fixed;
right:18px;
bottom:18px;
background:#25D366;
width:58px;height:58px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
color:white;
text-decoration:none;
box-shadow:0 0 20px #25D366aa;
}

/* FOOTER */
footer{
margin-top:45px;
padding:30px;
text-align:center;
background:#040916;
}
footer a{color:#00eaff;text-decoration:none;display:block;margin:6px}

</style>
</head>

<body>

<div class="card" data-service="other"><div class="icon">✨</div><h3>Other Services</h3></div>

</div>

<div class="modal" id="modal">
<div class="box">
<h3 id="title"></h3>
<form id="dynamicForm"></form>
</div>
</div>

<a class="whatsapp" href="https://wa.me/918092317965" target="_blank">🟢</a>

<footer>
<h3>Contact Us</h3>
<a href="https://wa.me/918092317965">Adarsh Gupta — +91 8092317965</a>
<a href="https://wa.me/918595674919">Ayush — +91 8595674919</a>
<p>Made with ❤️ in Bharat by QuanTa Solutions</p>
</footer>

<script>

const owners=["918092317965","918595674919"];
const modal=document.getElementById("modal");
const form=document.getElementById("dynamicForm");
const title=document.getElementById("title");

/* ===== FORMS ===== */

const forms={

tatkal:()=>`

/* OPEN MODAL */
document.querySelectorAll(".card").forEach(card=>{
card.onclick=()=>{
title.innerText=card.innerText;
form.innerHTML=forms[card.dataset.service]();
modal.classList.add("show");
};
});

/* PASSENGER ADD */
function addPassenger(){
document.getElementById("passengers")
.insertAdjacentHTML("beforeend",
`<input placeholder="Passenger Name">
<input placeholder="Passenger Age">`);
}
window.addPassenger=addPassenger;

/* CLOSE */
modal.onclick=e=>{
if(e.target===modal)modal.classList.remove("show");
};

/* SUBMIT */
document.addEventListener("submit",e=>{
if(e.target.id==="dynamicForm"){
e.preventDefault();

let data=[...e.target.querySelectorAll("input,select,textarea")]
.map(el=>(el.placeholder||el.options?.[el.selectedIndex]?.text)+": "+el.value)
.join("\n");

let msg=encodeURIComponent("NEW SERVICE REQUEST\n\n"+data);

owners.forEach(n=>{
window.open(`https://wa.me/${n}?text=${msg}`,"_blank");
});

modal.classList.remove("show");
e.target.reset();
}
});

</script>

</html>
