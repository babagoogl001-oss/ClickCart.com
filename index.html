<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple Ticket Request - ClickCart & Co.</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #00b4d8, #6d28d9);
    color: white;
    margin: 0; padding: 2rem;
  }
  h1 {
    text-align: center;
    margin-bottom: 1rem;
  }
  form {
    max-width: 480px;
    margin: 0 auto;
    background: rgba(255,255,255,0.1);
    padding: 1rem 1.25rem;
    border-radius: 12px;
  }
  label {
    display: block;
    margin-top: 1rem;
    margin-bottom: 0.25rem;
  }
  input, select {
    width: 100%;
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
    box-sizing: border-box;
  }
  .chips {
    margin-top: 0.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .chip {
    background: #6d28d9;
    padding: 0.25rem 0.6rem;
    border-radius: 20px;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: default;
  }
  .chip button {
    background: transparent;
    border: none;
    color: #d1d5db;
    cursor: pointer;
    font-size: 1rem;
  }
  button {
    margin-top: 1.5rem;
    width: 100%;
    background: linear-gradient(45deg, #6d28d9, #00b4d8);
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0.7rem 0;
  }
  footer {
    margin-top: 1.7rem;
    text-align: center;
    font-size: 0.9rem;
    opacity: 0.8;
  }
</style>
</head>
<body>

<h1>Ticket Booking Request</h1>

<form id="ticketForm" novalidate>
  <label>Source Station</label>
  <input id="source" placeholder="e.g. NDLS" required pattern="^[A-Z]{2,5}$" title="Enter station code in uppercase" />

  <label>Destination Station</label>
  <input id="destination" placeholder="e.g. BCT" required pattern="^[A-Z]{2,5}$" title="Enter station code in uppercase" />

  <label>Date of Journey</label>
  <input id="date" type="date" required />

  <label>Class</label>
  <select id="class" required>
    <option value="">Select class</option>
    <option value="SL">Sleeper (SL)</option>
    <option value="3A">AC 3 Tier (3A)</option>
    <option value="2A">AC 2 Tier (2A)</option>
    <option value="1A">AC First (1A)</option>
    <option value="CC">Chair Car (CC)</option>
    <option value="2S">Second Sitting (2S)</option>
  </select>

  <label>Quota</label>
  <select id="quota" required>
    <option value="">Select quota</option>
    <option value="GN">General (GN)</option>
    <option value="TQ">Tatkal (TQ)</option>
    <option value="PT">Premium Tatkal (PT)</option>
    <option value="LD">Ladies (LD)</option>
  </select>

  <label>Preferred Train(s)</label>
  <input id="trainInput" placeholder="Type train no/name and press Enter" />
  <div id="chips" class="chips"></div>

  <button type="button" id="submitBtn">Submit & WhatsApp</button>
</form>

<footer>Made with ♥️ In Bharat by Adarsh & Ayush</footer>

<script>
  const trainInput = document.getElementById('trainInput');
  const chips = document.getElementById('chips');
  const submitBtn = document.getElementById('submitBtn');

  let trains = [];

  trainInput.addEventListener('keydown', e => {
    if(e.key === 'Enter') {
      e.preventDefault();
      const val = trainInput.value.trim();
      if(val && !trains.includes(val)){
        trains.push(val);
        renderChips();
        trainInput.value = '';
      }
    }
  });

  function renderChips(){
    chips.innerHTML = '';
    trains.forEach(train => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = train;
      const btn = document.createElement('button');
      btn.textContent = '✕';
      btn.title = 'Remove ' + train;
      btn.onclick = () => {
        trains = trains.filter(t => t !== train);
        renderChips();
      };
      chip.appendChild(btn);
      chips.appendChild(chip);
    });
  }

  submitBtn.addEventListener('click', () => {
    const source = document.getElementById('source').value.trim().toUpperCase();
    const dest = document.getElementById('destination').value.trim().toUpperCase();
    const date = document.getElementById('date').value;
    const cls = document.getElementById('class').value;
    const quota = document.getElementById('quota').value;

    // Validation
    if(!source.match(/^[A-Z]{2,5}$/)) { alert('Please enter valid Source Station code (uppercase letters only).'); return; }
    if(!dest.match(/^[A-Z]{2,5}$/)) { alert('Please enter valid Destination Station code (uppercase letters only).'); return; }
    if(!date) { alert('Please select Date of Journey.'); return; }
    if(!cls) { alert('Please select Class.'); return; }
    if(!quota) { alert('Please select Quota.'); return; }
    if(trains.length===0) { alert('Please add at least one preferred train.'); return; }

    // Compose message
    let message = `Train Ticket Booking Request:%0A`;
    message += `Source: ${source}%0A`;
    message += `Destination: ${dest}%0A`;
    message += `Date of Journey: ${date}%0A`;
    message += `Class: ${cls}%0A`;
    message += `Quota: ${quota}%0A`;
    message += `Preferred Train(s): ${trains.join(', ')}`;

    // WhatsApp URL for two numbers
    const numbers = ['918092317965', '918595674919'];
    numbers.forEach(num => {
      window.open(`https://wa.me/${num}?text=${message}`, '_blank');
    });
  });
</script>

</body>
</html>
