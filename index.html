<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuanTa Services</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* ===== ORIGINAL UI (UNCHANGED COLORS) ===== */

*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:'Poppins',sans-serif;
background:#060c1a;
color:#f0f8ff;
overflow-x:hidden;
}

/* HEADER */
header{text-align:center;padding:40px 10px;}
h1{
font-family:'Rajdhani';
letter-spacing:4px;
color:#00d4ff;
font-size:2.5rem;
}
.tagline{opacity:.7;font-size:.9rem}

/* SERVICES GRID */
.services{
display:flex;
flex-wrap:wrap;
gap:12px;
padding:12px;
max-width:1000px;
margin:auto;
}
.card{
width:calc(50% - 6px);
background:rgba(255,255,255,.06);
border:1px solid rgba(0,212,255,.2);
border-radius:18px;
padding:22px 10px;
text-align:center;
cursor:pointer;
transition:.2s;
}
.card:active{transform:scale(.96)}
.card h3{
font-family:'Rajdhani';
color:#e0f2fe;
}

/* ===== MODAL ===== */

.modal-overlay{
display:none;
position:fixed;
top:0;left:0;right:0;bottom:0;
background:rgba(2,8,23,.93);
z-index:999;
justify-content:center;
align-items:center;
padding:15px;
}

.modal-overlay.show{display:flex;}

.modal-box{
background:#0d1428;
border:1px solid rgba(0,212,255,.25);
border-radius:22px;
padding:20px;
width:100%;
max-width:420px;
}

input,textarea,select{
width:100%;
margin-top:8px;
margin-bottom:10px;
padding:12px;
border-radius:10px;
border:1px solid rgba(0,212,255,.3);
background:rgba(255,255,255,.06);
color:white;
font-size:15px;
}

button{
border:none;
border-radius:12px;
padding:14px;
font-family:'Rajdhani';
font-size:1rem;
cursor:pointer;
}

.btn-submit{
background:linear-gradient(135deg,#7c3aed,#00d4ff);
color:white;
width:100%;
margin-top:10px;
}

.btn-close{
margin-top:8px;
background:rgba(239,68,68,.15);
color:#fca5a5;
width:100%;
}

/* ===== FLOAT BUTTON ===== */

.whatsapp-float{
position:fixed;
bottom:18px;
right:16px;
background:#25D366;
color:white;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:26px;
text-decoration:none;
box-shadow:0 0 20px rgba(0,0,0,.4);
z-index:999;
}

/* ===== FOOTER ===== */

footer{
margin-top:30px;
text-align:center;
padding:20px 12px;
border-top:1px solid rgba(0,212,255,.2);
background:rgba(0,0,0,.35);
}

.contact-card{
margin:8px auto;
max-width:320px;
padding:12px;
border-radius:12px;
border:1px solid rgba(0,212,255,.2);
background:rgba(255,255,255,.05);
text-decoration:none;
display:block;
color:white;
}

.footer-brand{
font-family:'Rajdhani';
letter-spacing:3px;
color:#00d4ff;
margin-top:12px;
}

.footer-text{opacity:.6;font-size:.85rem;margin-top:6px;}

@media(min-width:700px){
.card{width:calc(33.33% - 8px);}
}

</style>
</head>

<body>

<header>
<h1>QUANTA</h1>
<p class="tagline">Hamare bina online duniya adhoori hai 😎</p>
</header>

<!-- SERVICES -->
<section class="services">

<div class="card" data-service="Tatkal Ticket Booking"><h3>Tatkal Booking</h3></div>
<div class="card" data-service="Form Filling"><h3>Form Filling</h3></div>
<div class="card" data-service="Resume & Documents"><h3>Resume & CV</h3></div>
<div class="card" data-service="Poster Designing"><h3>Poster Design</h3></div>
<div class="card" data-service="Photo Editing"><h3>Photo Editing</h3></div>
<div class="card" data-service="Freelancing"><h3>Freelancing</h3></div>
<div class="card" data-service="Other Services"><h3>Other Services</h3></div>

</section>

<!-- MODAL -->
<div id="modal" class="modal-overlay">
<div class="modal-box">

<h2 id="serviceTitle">Service</h2>

<form id="serviceForm">

<input type="text" id="name" placeholder="Your Name" required>
<input type="tel" id="phone" placeholder="Mobile Number" required>

<input type="text" id="source" placeholder="Source (Tatkal only)">
<input type="text" id="dest" placeholder="Destination (Tatkal only)">
<input type="date" id="date">

<textarea id="details" placeholder="Describe your requirement"></textarea>

<button class="btn-submit">Submit Request</button>
<button type="button" class="btn-close" onclick="closeModal()">Cancel</button>

</form>

</div>
</div>

<!-- FLOAT BUTTON -->
<a class="whatsapp-float" href="https://wa.me/918092317965" target="_blank">💬</a>

<!-- FOOTER -->
<footer>

<a class="contact-card" href="https://wa.me/918092317965" target="_blank">
Adarsh Gupta — +91 8092317965
</a>

<a class="contact-card" href="https://wa.me/918595674919" target="_blank">
Ayush — +91 8595674919
</a>

<div class="footer-brand">QUANTA SOLUTIONS</div>
<div class="footer-text">
Made with ❤️ in Bharat by QuanTa Solutions
</div>

</footer>

<script>

/* OWNERS */
const owners=["918092317965","918595674919"];

const modal=document.getElementById("modal");
const title=document.getElementById("serviceTitle");
let selectedService="";

/* OPEN MODAL */
document.querySelectorAll(".card").forEach(card=>{
card.onclick=()=>{
selectedService=card.dataset.service;
title.innerText=selectedService;
modal.classList.add("show");
};
});

function closeModal(){
modal.classList.remove("show");
}

/* SUBMIT → WHATSAPP */
document.getElementById("serviceForm").onsubmit=function(e){

e.preventDefault();

let message=`📌 NEW CUSTOMER REQUEST

Service: ${selectedService}

Name: ${name.value}
Phone: ${phone.value}

From: ${source.value||"N/A"}
To: ${dest.value||"N/A"}
Date: ${date.value||"N/A"}

Requirement:
${details.value||"Not provided"}

— QuanTa Website`;

message=encodeURIComponent(message);

owners.forEach(num=>{
window.open(`https://wa.me/${num}?text=${message}`,'_blank');
});

this.reset();
closeModal();

};

</script>

</body>
</html>
