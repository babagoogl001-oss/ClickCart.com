<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClickCart & Co. — Online Services</title>
<style>
body{font-family:sans-serif; background:#121212; color:#fff;}
.services{display:flex; gap:20px; flex-wrap:wrap;}
.card{background:#333; padding:20px; border-radius:10px; cursor:pointer;}
.hidden{display:none;}
#formPopup{position:fixed; inset:0; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center;}
.form-box{background:#222; padding:20px; border-radius:10px; width:90%; max-width:500px;}
input, select, textarea{width:100%; margin:5px 0; padding:8px; border-radius:5px; border:none;}
button{padding:8px 12px; margin-top:10px; cursor:pointer;}
</style>
</head>
<body>

<h1>ClickCart & Co. — Services</h1>
<div class="services">
  <div class="card" data-service="Tatkal Ticket Booking">Tatkal Ticket Booking</div>
  <div class="card" data-service="Form Filling">Form Filling</div>
  <div class="card" data-service="Resume & Documents">Resume & Documents</div>
  <div class="card" data-service="Poster Designing">Poster Designing</div>
  <div class="card" data-service="Photo Editing">Photo Editing</div>
  <div class="card" data-service="Freelancing / Work With Us">Freelancing / Work With Us</div>
</div>

<div id="formPopup">
  <div class="form-box">
    <h2 id="formTitle"></h2>

    <label>Full Name</label><input id="userName" type="text">
    <label>Age</label><input id="userAge" type="number">
    <label>Gender</label>
    <select id="userGender">
      <option value="">Select</option>
      <option>Male</option><option>Female</option><option>Other</option>
    </select>
    <label>Phone</label><input id="userPhone">
    <label>Email</label><input id="userEmail">
    <label>Requirement / Note</label><textarea id="userReq"></textarea>

    <!-- Tatkal -->
    <div id="tatkalSection" class="hidden">
      <label>Source</label><input id="t_source">
      <label>Destination</label><input id="t_destination">
      <label>Date</label><input id="t_date" type="date">
    </div>

    <!-- Form Filling -->
    <div id="formFillSection" class="hidden">
      <label>Form Type</label>
      <select id="ff_type">
        <option value="">Select</option>
        <option>Sarkari</option>
        <option>Private</option>
      </select>
      <label>Form Name</label><input id="ff_formname">
    </div>

    <!-- Freelancing -->
    <div id="freelanceSection" class="hidden">
      <label>Project Title</label><input id="fr_title">
      <label>Budget</label><input id="fr_budget">
      <label>Project Description</label><textarea id="fr_desc"></textarea>
    </div>

    <button id="sendBtn">Submit & Send</button>
    <button id="closeBtn">Close</button>
  </div>
</div>

<script>
// common references
const formPopup = document.getElementById('formPopup');
const formTitle = document.getElementById('formTitle');
const tatkalSection = document.getElementById('tatkalSection');
const formFillSection = document.getElementById('formFillSection');
const freelanceSection = document.getElementById('freelanceSection');

const commonFields = ['userName','userAge','userGender','userPhone','userEmail','userReq'];

// open modal function
function openForm(service){
  formTitle.textContent = service;
  tatkalSection.classList.add('hidden');
  formFillSection.classList.add('hidden');
  freelanceSection.classList.add('hidden');

  if(service==='Tatkal Ticket Booking') tatkalSection.classList.remove('hidden');
  else if(service==='Form Filling') formFillSection.classList.remove('hidden');
  else if(service.startsWith('Freelancing')) freelanceSection.classList.remove('hidden');

  // load common data
  let saved = localStorage.getItem('common_user_info');
  if(saved){ 
    saved = JSON.parse(saved);
    commonFields.forEach(f=>{ if(saved[f]) document.getElementById(f).value = saved[f]; });
  }

  formPopup.style.display='flex';
}

// close
document.getElementById('closeBtn').onclick = ()=> formPopup.style.display='none';

// attach cards
document.querySelectorAll('.card').forEach(card=>{
  card.onclick = ()=> openForm(card.dataset.service);
});

// send button
document.getElementById('sendBtn').onclick = ()=>{
  const data = {};
  commonFields.forEach(f=> data[f]=document.getElementById(f).value);
  localStorage.setItem('common_user_info', JSON.stringify(data));

  // build message
  let msg = New Request:\nName: ${data.userName}\nAge: ${data.userAge}\nGender: ${data.userGender}\nPhone: ${data.userPhone}\nEmail: ${data.userEmail}\nNote: ${data.userReq};

  if(!tatkalSection.classList.contains('hidden')){
    msg += \nTatkal: ${document.getElementById('t_source').value} → ${document.getElementById('t_destination').value} on ${document.getElementById('t_date').value};
  }
  if(!formFillSection.classList.contains('hidden')){
    msg += \nForm: ${document.getElementById('ff_type').value} - ${document.getElementById('ff_formname').value};
  }
  if(!freelanceSection.classList.contains('hidden')){
    msg += \nProject: ${document.getElementById('fr_title').value}, Budget: ${document.getElementById('fr_budget').value}, Desc: ${document.getElementById('fr_desc').value};
  }

  // send to WhatsApp
  const numbers = ['918092317965','918595674919'];
  numbers.forEach(n=> window.open(https://wa.me/${n}?text=${encodeURIComponent(msg)},'_blank'));

  alert('WhatsApp opened for sending.');
  formPopup.style.display='none';
};
</script>
</body>
</html>
